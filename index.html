<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>전시 가이드</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#111111">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="pager">
  <section class="section" data-index="0">
    <div class="index">01 / 05</div>
    <h2>전시 제목</h2>
    <p>여기에 전시 소개 문구가 들어갑니다. 좌우로 스와이프해서 다음 섹션으로 이동하세요.</p>
  </section>

  <section class="section" data-index="1">
    <div class="index">02 / 05</div>
    <h2>섹션 2</h2>
    <p>이 섹션의 내용입니다. 내용이 길어지면 이 영역 안에서 위아래로 스크롤할 수 있습니다.
    여러 문단의 텍스트, 이미지, 캡션 등을 이 안에 자유롭게 배치할 수 있습니다.</p>
  </section>

  <section class="section" data-index="2">
    <div class="index">03 / 05</div>
    <h2>섹션 3</h2>
    <p>세 번째 섹션입니다.</p>
  </section>

  <section class="section" data-index="3">
    <div class="index">04 / 05</div>
    <h2>섹션 4</h2>
    <p>네 번째 섹션입니다.</p>
  </section>

  <section class="section" data-index="4">
    <div class="index">05 / 05</div>
    <h2>마무리</h2>
    <p>전시를 관람해 주셔서 감사합니다.</p>
  </section>
</div>

<div id="dots"></div>
<div class="hint">← swipe →</div>

<script src="app.js"></script>
</body>
</html>
